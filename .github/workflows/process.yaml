name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # network proxy aggregate config
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.PUSH_TOKEN }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        run: |
          set -o pipefail
          python -u subscribe/process.py --overwrite 2>&1 | tee /tmp/process.log

      - name: Generate v2ray subscription
        env:
          SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, base64, urllib.request, os, re, sys, datetime
          import yaml
          log = open("/tmp/process.log", encoding="utf-8", errors="replace").read()
          clash_ok = "[PushSuccess] push subscribes information to gist successed, group=[free::clash]" in log
          m = re.search(r"group \[free\] process finished, count: (\d+)", log)
          count = int(m.group(1)) if m else -1
          checked_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          token = os.environ["PUSH_TOKEN"]
          conf = json.load(urllib.request.urlopen(os.environ["SUBSCRIBE_CONF"]))
          items = conf["storage"]["items"]
          v2ray_st = items["sub-v2ray"]
          clash_st = items["sub-clash"]
          gid = v2ray_st["gist_id"]
          hdrs = {"Authorization": "token " + token, "Accept": "application/vnd.github+json"}
          def patch(files):
              req = urllib.request.Request(
                  "https://api.github.com/gists/" + gid,
                  data=json.dumps({"files": files}).encode(),
                  method="PATCH",
                  headers=hdrs,
              )
              return urllib.request.urlopen(req).status
          if not clash_ok:
              print("STALE: no successful clash push this run (collection failed or zero valid nodes); previous subscription output retained as stale fallback")
              status = {"checked_at": checked_at, "fresh": False, "valid_nodes": max(count, 0), "note": "collection or push failed this run; retained previous output"}
              patch({"status.json": {"content": json.dumps(status)}})
              sys.exit(0)
          raw = "https://gist.githubusercontent.com/%s/%s/raw/%s" % (clash_st["username"], clash_st["gist_id"], clash_st["filename"])
          text = urllib.request.urlopen(raw).read().decode()
          doc = yaml.safe_load(text)
          proxies = doc.get("proxies") or []
          def ss_link(p):
              ui = base64.b64encode((p["cipher"] + ":" + str(p["password"])).encode()).decode()
              return "ss://%s@%s:%s#%s" % (ui, p["server"], p["port"], p["name"])
          def vmess_link(p):
              ws = p.get("ws-opts") or {}
              obj = {"v": "2", "ps": p["name"], "add": p["server"], "port": str(p["port"]),
                     "id": p["uuid"], "aid": str(p.get("alterId", 0)), "scy": p.get("cipher", "auto"),
                     "net": p.get("network", "tcp"), "type": "none", "host": (ws.get("headers") or {}).get("Host", ""),
                     "path": ws.get("path", ""), "tls": "tls" if p.get("tls") else ""}
              return "vmess://" + base64.b64encode(json.dumps(obj, ensure_ascii=False).encode()).decode()
          links = []
          by_type = {}
          for p in proxies:
              t = p.get("type")
              by_type[t] = by_type.get(t, 0) + 1
              if t == "ss":
                  links.append(ss_link(p))
              elif t == "vmess":
                  links.append(vmess_link(p))
          status = {"checked_at": checked_at, "fresh": True, "valid_nodes": count, "sub_links": len(links), "by_type": by_type}
          files = {"status.json": {"content": json.dumps(status)}}
          if links:
              content = base64.b64encode("\n".join(links).encode()).decode()
              files[v2ray_st["filename"]] = {"content": content}
          patch(files)
          print("FRESH: clash push succeeded this run; checked_at:", checked_at, "valid_nodes:", count, "sub_links:", len(links), "by_type:", by_type)
          PYEOF

      - name: Timestamp
        run: date
