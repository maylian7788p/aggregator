name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # network proxy aggregate config
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.PUSH_TOKEN }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        run: python -u subscribe/process.py --overwrite

      - name: Generate v2ray subscription
        env:
          SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, base64, urllib.request, os, sys
          token = os.environ["PUSH_TOKEN"]
          conf = json.load(urllib.request.urlopen(os.environ["SUBSCRIBE_CONF"]))
          items = conf["storage"]["items"]
          v2ray_st = items["sub-v2ray"]
          gid = v2ray_st["gist_id"]
          hdrs = {"Authorization": "token " + token, "Accept": "application/vnd.github+json"}
          meta = json.load(urllib.request.urlopen(urllib.request.Request("https://api.github.com/gists/" + gid, headers=hdrs)))
          hist = meta.get("history", [])
          if len(hist) < 2:
              print("STALE-CHECK-SKIP: no prior gist revision to compare")
              sys.exit(0)
          v_new, v_old = hist[0]["version"], hist[1]["version"]
          base = "https://gist.githubusercontent.com/%s/%s/raw" % (v2ray_st["username"], gid)
          def fetch(v):
              return urllib.request.urlopen("%s/%s/clash.yaml" % (base, v)).read().decode()
          new_text = fetch(v_new)
          old_text = fetch(v_old)
          if new_text == old_text:
              print("STALE: clash.yaml unchanged this run (zero fresh nodes or push failed); leaving v2ray.txt unchanged")
              sys.exit(0)
          links = []
          in_proxies = False
          for line in new_text.splitlines():
              if line.startswith("proxies:"):
                  in_proxies = True
                  continue
              if not in_proxies:
                  continue
              s = line.strip()
              if not s.startswith("- {"):
                  break
              parts = {}
              for kv in s[2:].strip().strip("{}").split(", "):
                  if ": " in kv:
                      k, v = kv.split(": ", 1)
                      parts[k.strip()] = v.strip()
              if parts.get("type") == "ss":
                  userinfo = base64.b64encode((parts["cipher"] + ":" + parts["password"]).encode()).decode()
                  links.append("ss://%s@%s:%s#%s" % (userinfo, parts["server"], parts["port"], parts["name"]))
          if not links:
              print("STALE-SKIP: fresh clash.yaml has no ss nodes; leaving v2ray.txt unchanged")
              sys.exit(0)
          content = base64.b64encode("\n".join(links).encode()).decode()
          req = urllib.request.Request(
              "https://api.github.com/gists/" + gid,
              data=json.dumps({"files": {v2ray_st["filename"]: {"content": content}}}).encode(),
              method="PATCH",
              headers=hdrs,
          )
          resp = urllib.request.urlopen(req)
          print("v2ray.txt updated:", resp.status, "nodes:", len(links))
          PYEOF

      - name: Timestamp
        run: date
